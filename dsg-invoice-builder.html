<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Francisco's Invoice Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F4;--card:#FFFFFF;--ink:#14213D;--mute:#5B6678;--line:#D3DAE2;--teal:#2F7F83;--amber:#F2A900;--amberInk:#3A2A00;--field:#F7F9FB;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161F;--card:#18212D;--ink:#E7ECF2;--mute:#97A3B4;--line:#2A3646;--teal:#4FA7AB;--field:#121A24}}
:root[data-theme="dark"]{--bg:#10161F;--card:#18212D;--ink:#E7ECF2;--mute:#97A3B4;--line:#2A3646;--teal:#4FA7AB;--field:#121A24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,-apple-system,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 120px}
h1,h2,.big{font-family:"Barlow Semi Condensed",Barlow,system-ui,sans-serif}
h1{font-size:30px;line-height:1.1;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
h2{font-size:20px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
textarea{min-height:58px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:26px 14px;text-align:center;cursor:pointer}
.drop strong{display:block;font-size:18px}
.drop span{color:var(--mute);font-size:14px}
.drop input{display:none}
.err{color:#C0392B;margin:10px 0 0}
details summary{cursor:pointer;font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:20px;list-style:none}
details summary::after{content:"+";float:right;color:var(--mute)}
details[open] summary::after{content:"\2212"}
.line{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line.off .info,.line.off .amt{opacity:.4}
.line input[type=checkbox]{width:20px;height:20px;margin:3px 0 0;accent-color:var(--teal)}
.co{font-weight:600}
.meta{color:var(--mute);font-size:13px}
.amt input{width:92px;text-align:right;padding:6px 8px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .big{font-size:28px;line-height:1}
.bar small{display:block;opacity:.7;font-size:13px}
.go{margin-left:auto;background:var(--amber);color:var(--amberInk);border:0;border-radius:10px;padding:12px 18px;font:600 16px Barlow,sans-serif;cursor:pointer}
.go:disabled{opacity:.4;cursor:default}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}
.hist{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 12px;align-items:center}
.pill{border-radius:999px;padding:3px 10px;font-size:13px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.pill.paid{background:var(--teal);border-color:var(--teal);color:#fff}
.note{font-size:14px;color:var(--mute)}
.logo{display:flex;gap:12px;align-items:center;margin-top:10px}
.logo img{width:56px;height:56px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--teal);color:#fff;padding:8px 14px;border-radius:8px;font-size:14px;display:none}
@media (max-width:420px){.row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.line{transition:opacity .15s}}
</style>
</head>
<body>
<main>
  <h1>Francisco's Invoice Builder</h1>
  <p class="sub">Drop in the MobileTek export, check the runs, get a PDF.</p>

  <section>
    <label class="drop" for="file">
      <strong id="dropTitle">Choose MobileTek export</strong>
      <span id="dropSub">.xlsx or .csv from Export Orders</span>
      <input id="file" type="file" accept=".xlsx,.xls,.csv">
    </label>
    <p class="err" id="err" hidden></p>
  </section>

  <section id="linesBox" hidden>
    <h2>Runs on this invoice</h2>
    <div id="lines"></div>
  </section>

  <section>
    <h2>Invoice</h2>
    <div class="row">
      <div><label for="num">Invoice number</label><input id="num" inputmode="numeric"></div>
      <div><label for="date">Invoice date</label><input id="date" type="date"></div>
    </div>
    <div class="row">
      <div><label for="due">Due in (days)</label><input id="due" type="number" min="0"></div>
      <div><label for="note">Note on invoice</label><input id="note" placeholder="Optional"></div>
    </div>
  </section>

  <section>
    <details id="setup">
      <summary>Business and client info</summary>
      <label for="bizName">Your business</label><input id="bizName">
      <div class="row">
        <div><label for="bizPhone">Phone</label><input id="bizPhone"></div>
        <div><label for="bizEmail">Email</label><input id="bizEmail"></div>
      </div>
      <label for="bizAddr">Address</label><textarea id="bizAddr"></textarea>
      <div class="logo"><img id="logoImg" alt="" hidden><button class="ghost" id="logoBtn" type="button">Add logo</button><button class="ghost" id="logoDel" type="button" hidden>Remove</button><input id="logoFile" type="file" accept="image/png,image/jpeg" hidden></div>
      <label for="toName">Bill to</label><input id="toName">
      <label for="toPhone">Client phone</label><input id="toPhone">
      <label for="toAddr">Client address</label><textarea id="toAddr"></textarea>
      <p class="note">Saved on this device so you only fill it in once.</p>
    </details>
  </section>

  <section>
    <h2>Past invoices</h2>
    <div id="hist" class="hist"></div>
  </section>
</main>

<div class="bar"><div class="in">
  <div><span class="big" id="total">$0.00</span><small id="count">No runs loaded</small></div>
  <button class="go" id="go" disabled>Save PDF</button>
</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
// Core: parse a MobileTek export and build the invoice PDF.
function money(v) {
  if (typeof v === "number") return v;
  const n = parseFloat(String(v || "").replace(/[^0-9.\-]/g, ""));
  return isNaN(n) ? 0 : n;
}
function fmt(n) {
  return "$" + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}
function parseExport(rows) {
  // rows: array of arrays of strings
  let h = rows.findIndex(r => r.some(c => String(c).trim() === "DriverCommissionTotal"));
  if (h < 0) throw new Error("Couldn't find a DriverCommissionTotal column. Export from MobileTek with that column turned on.");
  const head = rows[h].map(c => String(c).trim());
  const col = name => head.indexOf(name);
  const c = {
    date: col("DDeparture"), id: col("OrderTrackingID"), co: col("Company Name"),
    ref: col("ClientRefNo"), pc: col("PCity"), dc: col("DCity"), amt: col("DriverCommissionTotal")
  };
  const out = [];
  for (const r of rows.slice(h + 1)) {
    const get = i => (i >= 0 && r[i] != null ? String(r[i]).trim() : "");
    const id = get(c.id), co = get(c.co);
    if (!id || !co || /^summary/i.test(id)) continue;
    out.push({
      date: get(c.date), id, company: co,
      ref: get(c.ref).replace(/\*+/g, "").replace(/\s+/g, " ").trim(),
      from: get(c.pc), to: get(c.dc), amount: money(get(c.amt)), on: true
    });
  }
  out.sort((a, b) => a.date.localeCompare(b.date));
  return out;
}
function buildPdf(jsPDF, s, inv, lines) {
  const doc = new jsPDF({ unit: "pt", format: "letter" });
  const W = doc.internal.pageSize.getWidth(), M = 48;
  const teal = [47, 127, 131], ink = [30, 36, 48], mute = [110, 118, 130];
  let y = 56;
  if (s.logo) { try { doc.addImage(s.logo, M, 40, 70, 70); } catch (e) {} }
  doc.setFont("helvetica", "bold"); doc.setFontSize(26); doc.setTextColor(...ink);
  doc.text("INVOICE", W - M, y, { align: "right" });
  doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(...mute);
  y += 18;
  const fromLines = [s.bizName, s.bizPhone, s.bizEmail, ...String(s.bizAddr || "").split("\n")].filter(Boolean);
  doc.setFont("helvetica", "bold"); doc.setTextColor(...ink);
  if (fromLines.length) doc.text(fromLines[0], W - M, y, { align: "right" });
  doc.setFont("helvetica", "normal"); doc.setTextColor(...mute);
  fromLines.slice(1).forEach((l, i) => doc.text(l, W - M, y + 13 * (i + 1), { align: "right" }));
  y = Math.max(y + 13 * fromLines.length + 20, 140);
  doc.setFontSize(9.5); doc.setFont("helvetica", "bold"); doc.setTextColor(...ink);
  doc.text("BILL TO", M, y);
  const toLines = [s.toName, s.toPhone, ...String(s.toAddr || "").split("\n")].filter(Boolean);
  toLines.forEach((l, i) => {
    doc.setFont("helvetica", i === 0 ? "bold" : "normal");
    doc.setTextColor(...(i === 0 ? ink : mute));
    doc.text(l, M, y + 15 + 13 * i);
  });
  const meta = [["Number", inv.number], ["Date", inv.dateLabel], ["Due date", inv.dueLabel]];
  meta.forEach(([k, v], i) => {
    doc.setFont("helvetica", "bold"); doc.setTextColor(...ink);
    doc.text(k + ":", W - M - 110, y + 13 * i, { align: "right" });
    doc.setFont("helvetica", "normal"); doc.setTextColor(...mute);
    doc.text(String(v), W - M, y + 13 * i, { align: "right" });
  });
  y += 15 + 13 * Math.max(toLines.length, 3) + 18;
  const body = lines.map(l => [
    l.date.split(" ")[0],
    l.company + "\n" + [l.ref ? "Ref " + l.ref : "", l.from && l.to ? l.from + " to " + l.to : ""].filter(Boolean).join("   "),
    l.id, fmt(l.amount)
  ]);
  doc.autoTable({
    startY: y, margin: { left: M, right: M },
    head: [["Date", "Description", "Tracking ID", "Amount"]], body,
    headStyles: { fillColor: teal, textColor: 255, fontStyle: "bold", fontSize: 9.5 },
    bodyStyles: { fontSize: 9.5, textColor: ink, cellPadding: { top: 6, bottom: 6, left: 6, right: 6 } },
    alternateRowStyles: { fillColor: [245, 247, 249] },
    columnStyles: { 0: { cellWidth: 48 }, 2: { cellWidth: 82 }, 3: { cellWidth: 70, halign: "right" } },
    didParseCell: d => { if (d.section === "head" && d.column.index === 3) d.cell.styles.halign = "right"; }
  });
  let fy = doc.lastAutoTable.finalY + 22;
  if (fy > doc.internal.pageSize.getHeight() - 80) { doc.addPage(); fy = 60; }
  const total = lines.reduce((a, l) => a + l.amount, 0);
  doc.setDrawColor(...teal); doc.setLineWidth(1.2); doc.line(W - M - 200, fy - 12, W - M, fy - 12);
  doc.setFontSize(10); doc.setFont("helvetica", "normal"); doc.setTextColor(...mute);
  doc.text(lines.length + (lines.length === 1 ? " delivery" : " deliveries"), W - M - 200, fy + 4);
  doc.setFont("helvetica", "bold"); doc.setFontSize(15); doc.setTextColor(...ink);
  doc.text("Total " + fmt(total), W - M, fy + 6, { align: "right" });
  if (s.note) {
    doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...mute);
    doc.text(doc.splitTextToSize(s.note, W - 2 * M - 220), M, fy + 4);
  }
  const pages = doc.getNumberOfPages();
  for (let p = 1; p <= pages; p++) {
    doc.setPage(p); doc.setFontSize(8.5); doc.setFont("helvetica", "normal"); doc.setTextColor(...mute);
    doc.text(p + " / " + pages, W / 2, doc.internal.pageSize.getHeight() - 24, { align: "center" });
  }
  return { doc, total };
}


const $ = id => document.getElementById(id);
const KEY = "dsgInvoice.v1";
const defaults = {
  bizName:"Luxury Delivery LLC", bizPhone:"720-421-2127", bizEmail:"javiermchavez79@gmail.com",
  bizAddr:"5542 Abilene st\nDenver, Co 80239",
  toName:"DSG Xpress", toPhone:"866-201-7696", toAddr:"18601 Green Valley Ranch Blvd 108 BOX 114\nDenver, Co 80249",
  next:4, dueDays:6, note:"", logo:"", history:[]
};
let S = Object.assign({}, defaults);
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign({}, defaults, JSON.parse(raw)); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const fields = ["bizName","bizPhone","bizEmail","bizAddr","toName","toPhone","toAddr","note"];
fields.forEach(f => { $(f).value = S[f] || ""; $(f).addEventListener("input", () => { S[f] = $(f).value; save(); }); });
$("num").value = String(S.next).padStart(3,"0");
$("due").value = S.dueDays;
$("due").addEventListener("input", () => { S.dueDays = parseInt($("due").value)||0; save(); });
const today = new Date(); $("date").value = today.toISOString().slice(0,10);
if (!S.bizName) $("setup").open = true;

let LINES = [];
function toast(t){ const el=$("toast"); el.textContent=t; el.style.display="block"; clearTimeout(toast.t); toast.t=setTimeout(()=>el.style.display="none",2600); }
function showErr(t){ $("err").textContent=t; $("err").hidden=!t; }

$("file").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  showErr("");
  try {
    const wb = XLSX.read(await f.arrayBuffer(), {type:"array"});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:""});
    LINES = parseExport(rows);
    if (!LINES.length) throw new Error("No orders found in that file.");
    $("dropTitle").textContent = f.name;
    $("dropSub").textContent = LINES.length + " orders found. Tap to pick a different file.";
    renderLines();
  } catch (err) { LINES=[]; renderLines(); showErr(err.message || "That file couldn't be read."); }
  e.target.value = "";
});

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function renderLines(){
  $("linesBox").hidden = !LINES.length;
  $("lines").innerHTML = LINES.map((l,i) => `
    <div class="line ${l.on?"":"off"}">
      <input type="checkbox" data-i="${i}" ${l.on?"checked":""} aria-label="Include ${esc(l.company)} ${esc(l.ref)}">
      <div class="info"><div class="co">${esc(l.company)}</div>
        <div class="meta">${esc(l.date)} | Ref ${esc(l.ref)} | ${esc(l.from)} to ${esc(l.to)}</div></div>
      <div class="amt"><input inputmode="decimal" data-a="${i}" value="${l.amount.toFixed(2)}" aria-label="Amount"></div>
    </div>`).join("");
  updateTotal();
}
$("lines").addEventListener("change", e => {
  const i = e.target.dataset.i; if (i==null) return;
  LINES[i].on = e.target.checked; e.target.closest(".line").classList.toggle("off", !e.target.checked); updateTotal();
});
$("lines").addEventListener("input", e => {
  const i = e.target.dataset.a; if (i==null) return;
  LINES[i].amount = money(e.target.value); updateTotal();
});
function picked(){ return LINES.filter(l => l.on); }
function updateTotal(){
  const p = picked(), t = p.reduce((a,l)=>a+l.amount,0);
  $("total").textContent = fmt(t);
  $("count").textContent = LINES.length ? p.length + " of " + LINES.length + " runs" : "No runs loaded";
  $("go").disabled = !p.length;
}

function label(d){ return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"}); }

let downloads = null;
if (window.claude && claude.use) claude.use("downloads").then(d => { downloads = d; }).catch(()=>{});

$("go").addEventListener("click", async () => {
  const lines = picked(); if (!lines.length) return;
  const d = new Date($("date").value + "T00:00:00Z"); const due = new Date(d); due.setUTCDate(due.getUTCDate() + (parseInt($("due").value)||0));
  const number = $("num").value.trim() || String(S.next).padStart(3,"0");
  const { doc, total } = buildPdf(window.jspdf.jsPDF, S, { number, dateLabel:label(d), dueLabel:label(due) }, lines);
  const name = "Invoice " + number + " " + (S.toName||"").replace(/[^\w ]/g,"") + ".pdf";
  const blob = doc.output("blob");
  try {
    if (downloads) await downloads.save({ filename:name, data:blob });
    else doc.save(name);
  } catch (err) { if (err && err.code === "declined") return; toast("Couldn't save the PDF here."); return; }
  if (!S.history.some(h => h.number === number)) S.history.unshift({ number, date:$("date").value, total, runs:lines.length, paid:false });
  const n = parseInt(number, 10); if (!isNaN(n) && n >= S.next) S.next = n + 1;
  $("num").value = String(S.next).padStart(3,"0");
  save(); renderHist(); toast("Invoice " + number + " saved");
});

function renderHist(){
  const h = S.history;
  if (!h.length) { $("hist").innerHTML = '<p class="note" style="grid-column:1/-1;margin:0">Invoices you save show up here so you can mark them paid.</p>'; return; }
  $("hist").innerHTML = h.map((x,i)=>`
    <strong>#${esc(x.number)}</strong>
    <span class="meta">${label(new Date(x.date+"T00:00:00Z"))} | ${x.runs} runs</span>
    <span>${fmt(x.total)}</span>
    <button class="pill ${x.paid?"paid":""}" data-h="${i}">${x.paid?"Paid":"Unpaid"}</button>`).join("");
}
$("hist").addEventListener("click", e => { const i=e.target.dataset.h; if (i==null) return; S.history[i].paid=!S.history[i].paid; save(); renderHist(); });
renderHist();

function showLogo(){ $("logoImg").hidden=!S.logo; if (S.logo) $("logoImg").src=S.logo; $("logoDel").hidden=!S.logo; $("logoBtn").textContent=S.logo?"Change logo":"Add logo"; }
$("logoBtn").onclick = () => $("logoFile").click();
$("logoDel").onclick = () => { S.logo=""; save(); showLogo(); };
$("logoFile").addEventListener("change", e => {
  const f=e.target.files[0]; if(!f) return;
  const img=new Image(); img.onload=()=>{ const c=document.createElement("canvas"); const s=Math.min(1,300/Math.max(img.width,img.height));
    c.width=img.width*s; c.height=img.height*s; const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    S.logo=c.toDataURL("image/jpeg",.85); save(); showLogo(); }; img.src=URL.createObjectURL(f);
});
showLogo();
</script>
</body>
</html>
